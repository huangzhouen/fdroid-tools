<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{blog-title}</title>
    <meta name="description" content="{blog-description}">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="site-branding">
                <h1 class="site-title"><a href="/">{blog-title}</a></h1>
                <p class="site-description">{blog-description}</p>
            </div>
            <nav class="main-nav">
                <button class="menu-toggle" aria-label="切换菜单">☰</button>
                <ul class="nav-menu">
                    <li><a href="/">首页</a></li>
                    <li><a href="/p/about.html">关于</a></li>
                    <li><a href="/p/contact.html">联系</a></li>
                    <li><a href="/search">搜索</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <div class="container">
            <div class="content-wrapper">
                <section class="blog-content">
                    <b:section id="main" class="main-section" showaddelement="no">
                        <b:widget id="Blog1" locked="true" title="博客文章" type="Blog">
                            <b:includable id="main" var="top">
                                <b:loop values="data:posts" var="post">
                                    <article class="post-card">
                                        <h2 class="post-title">
                                            <a expr:href="data:post.url"><data:post.title/></a>
                                        </h2>
                                        <div class="post-meta">
                                            <span class="post-date"><data:post.date/></span>
                                            <span class="post-author">作者：<data:post.author/></span>
                                            <b:if cond="data:post.labels">
                                                <span class="post-labels">
                                                    <b:loop values="data:post.labels" var="label">
                                                        <a expr:href="data:label.url"><data:label.name/></a>
                                                    </b:loop>
                                                </span>
                                            </b:if>
                                        </div>
                                        <div class="post-summary">
                                            <data:post.snippet/>
                                        </div>
                                        <a expr:href="data:post.url" class="read-more">阅读全文 →</a>
                                    </article>
                                </b:loop>
                                <div class="pagination">
                                    <b:include name="nextprev"/>
                                </div>
                            </b:includable>
                            <b:includable id="nextprev">
                                <div class="blog-pager">
                                    <b:if cond="data:newerPageUrl">
                                        <a class="blog-pager-newer-link" expr:href="data:newerPageUrl">← 新文章</a>
                                    </b:if>
                                    <b:if cond="data:olderPageUrl">
                                        <a class="blog-pager-older-link" expr:href="data:olderPageUrl">旧文章 →</a>
                                    </b:if>
                                </div>
                            </b:includable>
                        </b:widget>
                    </b:section>
                </section>

                <aside class="sidebar">
                    <b:section id="sidebar" class="sidebar-section" showaddelement="yes">
                        <b:widget id="Profile1" locked="false" title="关于我" type="Profile"/>
                        <b:widget id="Label1" locked="false" title="标签云" type="Label"/>
                        <b:widget id="Archive1" locked="false" title="归档" type="BlogArchive"/>
                    </b:section>
                </aside>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© <span id="currentYear"></span> {blog-title} | 使用 Blogger 模板</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
